name: Validate events feed

on:
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "deploy/**"
      - "marketplaces/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: validate-events-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test feed rules
        run: npm test

      - name: Verify season API container
        env:
          CATALOG_DOMAIN: catalog.example.test
        run: |
          docker compose config --quiet
          docker build --tag whoseiptv-catalog:ci .
          container=$(docker run --detach --env CATALOG_REFRESH_MINUTES=0 --env CATALOG_TOKEN=ci-probe whoseiptv-catalog:ci)
          trap 'docker rm --force --volumes "$container" >/dev/null' EXIT
          for attempt in {1..15}; do
            if docker exec "$container" curl -fsS http://127.0.0.1:8780/livez >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "$container" curl -fsS http://127.0.0.1:8780/livez
          test "$(docker exec "$container" curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8780/v1/fixtures)" = 401
          test "$(docker exec "$container" curl -sS -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-probe' http://127.0.0.1:8780/healthz)" = 503

      - name: Validate fixed-epoch feed determinism
        shell: bash
        run: |
          epoch=$(node -p "JSON.parse(require('node:fs').readFileSync('feed/events/v1/events.json', 'utf8')).generatedAtEpochSeconds")
          hash_before=$(git hash-object feed/events/v1/events.json)
          now=$(date +%s)
          if (( now - epoch <= 21600 && epoch - now <= 21600 )); then
            SOURCE_DATE_EPOCH="$epoch" npm run build
            test "$hash_before" = "$(git hash-object feed/events/v1/events.json)"
          else
            echo "Committed feed epoch is outside the supported fixed-epoch validation window; skipping."
          fi

      - name: Build validated feed
        run: npm run build

      - name: Audit broadcaster coverage
        run: npm run coverage:broadcasts

      - name: Check generated diff formatting
        run: git diff --check
