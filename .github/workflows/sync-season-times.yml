name: Sync season start times

on:
  schedule:
    - cron: "37 * * * *"
  workflow_run:
    workflows: ["Refresh sports events"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-season-times.yml"
      - "scripts/build-season-catalog.mjs"
      - "scripts/catalog/**"
      - "scripts/sync-season-times.mjs"

permissions:
  contents: write

concurrency:
  group: sync-season-times
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Retrieve published start times
        uses: actions/checkout@v7
        with:
          ref: season-times
          path: published
      - run: node --test tests/season-times.test.mjs
      - run: npm run catalog:build -- "$RUNNER_TEMP/season-catalog.json"
        env:
          CATALOG_TIMES_ONLY: "1"
      - run: node scripts/sync-season-times.mjs "$RUNNER_TEMP/season-catalog.json" published/feed/seasons/v1/start-times.json
      - name: Publish verified times
        working-directory: published
        run: |
          git add -- feed/seasons/v1/start-times.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "whoseiptv-events-bot"
          git config user.email "whoseiptv-events-bot@users.noreply.github.com"
          git commit -m "Refresh season start times"
          git push origin HEAD:refs/heads/season-times
